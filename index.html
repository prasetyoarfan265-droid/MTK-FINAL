<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelompok 1 Kelas 12.1 · Asesmen 2 Matematika</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mute:#5b6577;--line:#d5dbe8;--blue:#1d5cff;--green:#0f9d6e;--red:#d92d4b;--bg2:#eaeffa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#030712;--card:#0f172a;--ink:#f8fafc;--mute:#9aa6bb;--line:#243049;--blue:#1d5cff;--green:#19c58d;--red:#ff5c7a;--bg2:#162038}}
:root[data-theme="dark"]{--bg:#030712;--card:#0f172a;--ink:#f8fafc;--mute:#9aa6bb;--line:#243049;--blue:#1d5cff;--green:#19c58d;--red:#ff5c7a;--bg2:#162038}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "DM Sans",system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
header b{font-size:20px;letter-spacing:-.02em}
.btn{font:inherit;font-weight:500;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:12px;padding:12px 20px;cursor:pointer}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.g{background:var(--green);border-color:var(--green);color:#04170f}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;margin-bottom:22px}
.card h2{font-size:28px;line-height:1.15;margin:4px 0 14px;letter-spacing:-.02em}
.tag{font-weight:500;color:var(--blue)}.tag.g{color:var(--green)}
.meta{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;color:var(--mute);margin:14px 0 20px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.bar{height:6px;background:var(--bg2);border-radius:9px;overflow:hidden;margin:6px 0 18px}.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.q{font-size:19px;font-weight:500;margin:14px 0 18px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:10px;cursor:pointer}
.opt.sel{border-color:var(--blue);background:var(--bg2)}
.opt.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 18%,transparent)}
.opt.no{border-color:var(--red);background:color-mix(in srgb,var(--red) 18%,transparent)}
.fb{border-left:4px solid var(--green);background:var(--bg2);border-radius:10px;padding:12px 16px;margin:14px 0}.fb.no{border-color:var(--red)}
.top{display:flex;justify-content:space-between;align-items:center;font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--mute)}
.score{font-size:56px;font-weight:700;letter-spacing:-.03em;margin:0}
.li{padding:12px 0;border-top:1px solid var(--line)}.li small{color:var(--mute)}
[hidden]{display:none!important}
header{flex-wrap:wrap}.hr{display:flex;gap:8px}
#nav{display:flex;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);overflow-x:auto}
#nav a{padding:8px 18px;border:1px solid var(--line);border-radius:99px;color:var(--ink);text-decoration:none;font-weight:500;white-space:nowrap}
#nav a.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.mem{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.mem img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--bg2)}
.mem div{padding:12px 14px 16px}.mem h3{margin:0 0 4px;font-size:15px;line-height:1.25}.mem p{margin:0 0 8px;color:var(--mute);font-size:14px}
.pill{display:inline-block;font:700 12px "JetBrains Mono",ui-monospace,monospace;background:var(--bg2);border-radius:99px;padding:4px 10px}
@media (max-width:480px){header b{font-size:16px}#th{padding:10px 12px;font-size:14px}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.sc{text-align:center}.sc h2{font-size:26px;margin:8px 0 4px}.ring{width:170px;height:170px}
.stats{display:flex;justify-content:center;gap:12px;margin:18px 0}
.stats div{flex:1;max-width:110px;background:var(--bg2);border-radius:16px;padding:10px 6px}
.stats b{display:block;font-size:26px;line-height:1.2}.stats span{font-size:13px;color:var(--mute)}
.rh{margin:28px 0 12px;font-size:20px}
.rv{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.rv.no{border-left-color:var(--red)}
.rt{display:flex;align-items:center;gap:10px}.rt small{margin-left:auto;font-weight:700;color:var(--green)}.rv.no .rt small{color:var(--red)}
.bd{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--green);font-size:14px}.rv.no .bd{background:var(--red)}
.rv p{margin:10px 0 6px}.rv>small{color:var(--mute)}
@media print{header,.row{display:none!important}}
@media (min-width:900px){header{padding:18px max(28px,calc((100vw - 900px)/2))}main{max-width:820px;padding-top:44px}h1{font-size:40px}.card{padding:34px}.card h2{font-size:34px}.q{font-size:22px}.opt{padding:16px 22px;font-size:17px}}
.btn,.opt{touch-action:manipulation}
</style>

<body>
<header>
  <b>KELOMPOK 1 KELAS 12.1</b>
  <div class="hr"><button class="btn" id="th" type="button"></button></div>
</header>
<nav id="nav"><a href="#" data-go="home">Beranda</a><a href="#profil" data-go="profil">Profil Kelompok</a></nav>
<main id="app"></main>
<script>
// Ganti contoh soal ini dengan 25 soal PSAS Anda (a = indeks jawaban benar, mulai dari 0)
const Q=[
{q:'Kota A, B, dan C berada dalam satu provinsi dan kota B berada di antara kota A dan C. Perjalanan A ke B memiliki 5 pilihan jalan dan B ke C memiliki 3 pilihan jalan. Dio melakukan perjalanan pergi-pulang dari kota A ke kota C melalui kota B. Banyak variasi perjalanan yang dapat dilakukan Dio adalah …',o:['15','30','75','150','225'],a:4,p:'Gunakan aturan perkalian.<br>Pergi: A→B→C = 5 × 3 = 15.<br>Pulang: C→B→A = 3 × 5 = 15.<br>Pergi dan pulang dilakukan berurutan: 15 × 15 = <b>225</b> cara.'},
{q:'Arga tinggal di kota C. Ia pergi ke kota A melalui kota B, lalu kembali lagi ke kota C. Tersedia 5 jalan dari A ke B dan 3 jalan dari B ke C. Jika saat pulang Arga tidak boleh melewati jalan yang sama dengan saat pergi, banyak variasi perjalanan Arga adalah …',o:['30','60','90','120','150'],a:3,p:'Pergi: C→B ada 3 pilihan, B→A ada 5 pilihan.<br>Pulang: A→B tinggal 4 pilihan (satu jalan sudah dipakai), B→C tinggal 2 pilihan.<br>Aturan perkalian: 3 × 5 × 4 × 2 = <b>120</b> cara.'},
{q:'Vito, ayah, ibu, serta dua adiknya, Rina dan Rani, makan malam bersama mengelilingi meja bundar dengan 5 kursi. Perhatikan pernyataan berikut:<br>1. Jika ayah dan ibu harus duduk berdampingan, ada 12 cara.<br>2. Jika Rani harus duduk di antara ayah dan ibu, ada 24 cara.<br>3. Jika Vito harus duduk di antara Rina dan Rani, ada 4 cara.<br>4. Jika Vito harus duduk di dekat ayah dan Rina harus duduk di dekat ibu, ada 4 cara.<br>5. Jika Vito dan kedua adiknya harus duduk berdampingan, ada 12 cara.<br>Kombinasi pernyataan yang benar adalah …',o:['1, 2, dan 3','1, 3, dan 5','2, 3, dan 4','1, 4, dan 5','2, 4, dan 5'],a:1,p:'Permutasi siklis: (n − 1)!.<br><b>1. Benar.</b> Ayah–ibu dijadikan satu kelompok, jadi ada 4 objek: (4−1)! × 2! = 6 × 2 = 12.<br><b>2. Salah.</b> Ayah–Rani–ibu satu kelompok (ayah dan ibu bisa bertukar: 2!), lalu 3 objek: (3−1)! = 2. Total 2 × 2 = 4, bukan 24.<br><b>3. Benar.</b> Rina–Vito–Rani satu kelompok (2!), lalu 3 objek: (3−1)! = 2. Total 2 × 2 = 4.<br><b>4. Salah.</b> Vito dianggap tetap. Ayah punya 2 pilihan kursi di sebelah Vito; Rina dan ibu harus berdampingan dengan 2 pilihan posisi dan 2 urutan. Total 2 × 2 × 2 = 8, bukan 4.<br><b>5. Benar.</b> Vito, Rina, Rani satu kelompok (3! = 6), lalu 3 objek: (3−1)! = 2. Total 6 × 2 = 12.<br>Pernyataan yang benar: <b>1, 3, dan 5</b>.'},
{q:'Sebuah ruang rahasia memiliki password yang terdiri atas 4 huruf dan 2 angka. Angka yang tersedia: bilangan prima kurang dari 10 (2, 3, 5, 7). Huruf yang tersedia: b, c, r, s, t, a, v. Setiap karakter hanya boleh dipakai satu kali. Pasangkan ketentuan berikut dengan banyak password yang dapat disusun:<br>1. Angka harus ganjil dan huruf harus konsonan<br>2. Tanpa ketentuan angka dan huruf yang dipilih<br>3. Harus terdapat huruf vokal<br>4. Harus terdapat angka genap<br>Pilihan pasangan (berurutan 1–4) yang tepat adalah …',o:['32.400; 151.200; 86.400; 75.600','32.400; 86.400; 151.200; 75.600','34.600; 151.200; 86.400; 75.600','32.400; 151.200; 75.600; 86.400','75.600; 151.200; 86.400; 32.400'],a:0,p:'Angka: 2, 3, 5, 7 (4 angka). Huruf: 7 huruf, konsonan 6 (b, c, r, s, t, v), vokal hanya a. Posisi 2 angka di antara 6 tempat: C(6,2) = 15.<br><b>1.</b> Huruf konsonan: ₆P₄ = 360. Angka ganjil (3, 5, 7): ₃P₂ = 6. Total 360 × 6 × 15 = <b>32.400</b>.<br><b>2.</b> Huruf: ₇P₄ = 840. Angka: ₄P₂ = 12. Total 840 × 12 × 15 = <b>151.200</b>.<br><b>3.</b> Susunan huruf yang memuat a = semua (840) − tanpa a (₆P₄ = 360) = 480. Total 480 × 12 × 15 = <b>86.400</b>.<br><b>4.</b> Angka genap hanya 2; pasangannya dipilih dari 3 angka lain dan urutannya diperhatikan: 3 × 2 = 6. Total 840 × 6 × 15 = <b>75.600</b>.<br>Pasangan: 32.400; 151.200; 86.400; 75.600.'},
{q:'Menggunakan informasi password pada nomor 4, jika password harus diawali dengan huruf v, banyak password yang dapat disusun adalah …',o:['86.400','43.200','32.400','14.400','12.200'],a:3,p:'Karena v sudah dipakai di posisi pertama, tersisa 6 huruf untuk 3 posisi huruf dan 4 angka untuk 2 posisi angka.<br>Susunan 3 huruf: ₆P₃ = 6 × 5 × 4 = 120.<br>Susunan 2 angka: ₄P₂ = 4 × 3 = 12.<br>Posisi angka di antara 5 tempat tersisa: C(5,2) = 10.<br>Total: 120 × 12 × 10 = <b>14.400</b>.'},
{q:'Tasya memasukkan 20 bola ke dalam kotak, terdiri atas 7 bola biru, 4 bola merah, 6 bola kuning, dan sisanya bola hijau. Tasya mengambil satu bola secara acak. Peluang terambil bola biru atau hijau adalah …',o:['7/20','3/20','2/5','3/5','1/2'],a:4,p:'Bola hijau = 20 − (7 + 4 + 6) = 3.<br>Biru atau hijau = 7 + 3 = 10 bola.<br>P = 10/20 = <b>1/2</b>.'},
{q:'Tasya memiliki 20 bola: 7 biru, 4 merah, 6 kuning, dan 3 hijau. Ia mengambil dua bola sekaligus secara acak tanpa pengembalian. Pasangan peluang yang tepat (berurutan) untuk kejadian berikut adalah …<br>1. Kedua bola biru<br>2. Kedua bola merah<br>3. Kedua bola kuning<br>4. Terambil bola merah dan hijau<br>5. Terambil bola kuning dan hijau',o:['21/190; 3/95; 3/38; 6/95; 9/95','21/190; 3/95; 3/38; 9/95; 6/95','21/190; 6/95; 3/38; 6/95; 9/95','21/190; 3/95; 3/38; 12/95; 9/95','21/190; 3/95; 3/19; 6/95; 9/95'],a:0,p:'Dua bola diambil sekaligus, gunakan kombinasi. Seluruh kejadian: C(20,2) = (20 × 19)/2 = 190.<br>1. Biru–biru: C(7,2) = 21 → <b>21/190</b>.<br>2. Merah–merah: C(4,2) = 6 → 6/190 = <b>3/95</b>.<br>3. Kuning–kuning: C(6,2) = 15 → 15/190 = <b>3/38</b>.<br>4. Merah dan hijau: 4 × 3 = 12 → 12/190 = <b>6/95</b>.<br>5. Kuning dan hijau: 6 × 3 = 18 → 18/190 = <b>9/95</b>.'},
{q:'Tasya memiliki 20 bola, 6 di antaranya berwarna kuning. Ia mengambil tiga bola sekaligus secara acak tanpa pengembalian. Peluang ketiga bola yang terambil semuanya berwarna kuning adalah …',o:['1/57','1/38','1/19','3/38','3/20'],a:0,p:'P = C(6,3) / C(20,3).<br>C(6,3) = (6 × 5 × 4)/(3 × 2 × 1) = 20.<br>C(20,3) = (20 × 19 × 18)/(3 × 2 × 1) = 1.140.<br>P = 20/1.140 = <b>1/57</b>.'},
{q:'Seorang ahli geologi memperkirakan peluang terjadinya banjir dalam lima tahun ke depan: kota X = 2/3, kota Y = 1/4, kota Z = 1/2. Dengan asumsi kejadian banjir di setiap kota saling bebas, tentukan benar atau salah pernyataan berikut.<br>1. Peluang kota X dan Y mengalami banjir sebesar 1/6.<br>2. Peluang kota X dan Z mengalami banjir sebesar 1/4.<br>3. Peluang kota Y dan Z mengalami banjir sebesar 1/8.<br>4. Peluang kota X dan Y mengalami banjir lebih kecil daripada kota X dan Z.<br>5. Peluang kota X dan Z mengalami banjir lebih besar daripada kota Y dan Z.',o:['Benar – Benar – Salah – Benar – Benar','Benar – Salah – Benar – Benar – Benar','Salah – Benar – Benar – Salah – Benar','Benar – Salah – Salah – Benar – Salah','Salah – Salah – Benar – Benar – Salah'],a:1,p:'Kejadian saling bebas, maka P(A∩B) = P(A) × P(B).<br><b>1. Benar.</b> X dan Y: 2/3 × 1/4 = 2/12 = 1/6.<br><b>2. Salah.</b> X dan Z: 2/3 × 1/2 = 2/6 = 1/3, bukan 1/4.<br><b>3. Benar.</b> Y dan Z: 1/4 × 1/2 = 1/8.<br><b>4. Benar.</b> 1/6 < 1/3.<br><b>5. Benar.</b> 1/3 > 1/8.<br>Urutan: Benar – Salah – Benar – Benar – Benar.'},
{q:'Berdasarkan informasi nomor 9 (P(X) = 2/3, P(Y) = 1/4, P(Z) = 1/2), peluang ketiga kota X, Y, dan Z mengalami banjir secara bersamaan adalah …',o:['1/24','1/8','1/12','1/6','1/3'],a:2,p:'P(X∩Y∩Z) = P(X) × P(Y) × P(Z)<br>= 2/3 × 1/4 × 1/2<br>= 2/24 = <b>1/12</b>.'}
];
const T=120*60000;
const $=s=>document.querySelector(s),app=$('#app');
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let P1=ld('psas_p1',{}),P2=ld('psas_p2',{ans:{}}),i=0,tm=null;
const n=10,L="ABCDE";
const cnt=o=>Object.keys(o).length;
const benar=a=>Q.filter((x,k)=>a[k]===x.a).length;

function isDark(){const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches}
function themeBtn(){$('#th').textContent=isDark()?'☀ Mode Terang':'☾ Mode Gelap'}
$('#th').onclick=()=>{document.documentElement.dataset.theme=isDark()?'light':'dark';try{localStorage.setItem('psas_th',document.documentElement.dataset.theme)}catch(e){}themeBtn()};
try{const t=localStorage.getItem('psas_th');if(t)document.documentElement.dataset.theme=t}catch(e){}
themeBtn();

function home(){
  clearInterval(tm);
  const a=cnt(P1),b=cnt(P2.ans);
  app.innerHTML=`<h1>Asesmen Matematika</h1><p class="sub">Progres tersimpan otomatis di perangkat Anda</p>
  <section class="card"><span class="tag">Mode Belajar Mandiri</span>
  <h2>SOAL ASESMEN 2 KELOMPOK MATEMATIKA</h2>
  <p>Setiap butir soal yang dijawab langsung menampilkan status ketepatan beserta pembahasan langkah demi langkah. Cocok untuk memahami konsep dan strategi penyelesaian soal matematika.</p>
  <div class="meta">${n} soal · Tanpa batas waktu<br><b>Progres: ${a}/${n} terjawab</b></div>
  <div class="row"><button class="btn p" data-go="latihan">${a?'Lanjutkan':'Mulai'} Latihan</button>
  ${a?'<button class="btn" data-go="rekap">Lihat Skor</button><button class="btn g" data-reset="1">Ulangi Soal dari Awal</button>':''}</div></section>`;
}

function quiz(m){
  if(!Q.length){app.innerHTML='<h1>Soal belum tersedia</h1><p class="sub">Isi soal akan ditambahkan nanti.</p><div class="row"><button class="btn p" data-go="home">Kembali ke Paket</button></div>';return}
  const s=m==='latihan'?P1:P2.ans,tryout=m==='tryout',x=Q[i],c=s[i];
  if(tryout&&!P2.start){P2.start=Date.now();sv('psas_p2',P2)}
  const opts=x.o.map((t,k)=>{
    let cl='opt';
    if(!tryout&&c!==undefined){if(k===x.a)cl+=' ok';else if(k===c)cl+=' no'}
    else if(tryout&&c===k)cl+=' sel';
    return `<button class="${cl}" data-o="${k}">${L[k]}. ${t}</button>`}).join('');
  const fb=!tryout&&c!==undefined?`<div class="fb ${c===x.a?'':'no'}"><b>${c===x.a?'Benar!':'Kurang tepat.'}</b> Jawaban: ${L[x.a]}.<br>${x.p}</div>`:'';
  const last=i===n-1;
  app.innerHTML=`<div class="top"><span>Soal ${i+1}/${n}</span>${tryout?'<span id="t"></span>':''}<a href="#" data-go="home" style="color:inherit">Keluar</a></div>
  <div class="bar"><i style="width:${cnt(s)/n*100}%"></i></div>
  <p class="q">${x.q}</p>${opts}${fb}
  <div class="row" style="margin-top:18px"><button class="btn" data-nav="-1" ${i?'':'disabled'}>Sebelumnya</button>
  ${last?'<button class="btn g" data-go="rekap">Lihat Skor</button>':`<button class="btn p" data-nav="1">Berikutnya</button>`}</div>`;
  if(tryout){clearInterval(tm);const f=()=>{const r=Math.max(0,P2.start+T-Date.now()),e=$('#t');if(!e)return clearInterval(tm);e.textContent=String(Math.floor(r/60000)).padStart(2,'0')+':'+String(Math.floor(r/1000)%60).padStart(2,'0');if(!r)fin()};f();tm=setInterval(f,1000)}
}

function fin(){P2.done=true;sv('psas_p2',P2);clearInterval(tm);go('hasil')}

let DL=null;
try{window.claude&&window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{})}catch(e){}
const cl=s=>String(s).replace(/<br>/g,'\n').replace(/<\/?[a-z][^>]*>/gi,'').replace(/[\u2080-\u2089]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x2080+48)).replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u2229/g,' dan ').replace(/[^\x00-\xFF\u2013\u2014\u2026\u2018\u2019\u201C\u201D]/g,'');
const ans=(a,k)=>a[k]===undefined?'-':L[a[k]]+'. '+Q[k].o[a[k]];

async function pdf(a){
  if(!window.jspdf){window.print();return}
  const b=benar(a),t=cnt(a),d=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),M=16,mw=178;let y=M;
  const tx=(s,z,bold,col)=>{d.setFont('helvetica',bold?'bold':'normal');d.setFontSize(z);d.setTextColor(...(col||[15,23,42]));
    d.splitTextToSize(cl(s),mw).forEach(l=>{if(y+z*.46>285){d.addPage();y=M}d.text(l,M,y);y+=z*.46});y+=1.5};
  tx('KELOMPOK 1 KELAS 12.1',11,1,[29,92,255]);
  tx('SOAL ASESMEN 2 KELOMPOK MATEMATIKA',16,1);
  tx('Skor: '+Math.round(b/n*100)+' / 100',22,1,[15,157,110]);
  tx('Benar '+b+' | Salah '+(t-b)+' | Tidak dijawab '+(n-t)+' (dari '+n+' soal)',11,0,[91,101,119]);
  y+=4;
  Q.forEach((x,k)=>{
    const ok=a[k]===x.a;y+=2;
    tx((k+1)+'. '+(ok?'[BENAR] ':a[k]===undefined?'[TIDAK DIJAWAB] ':'[SALAH] ')+x.q,11,1,ok?[15,157,110]:[217,45,75]);

}

const M=[['ARFAN FAJRI PRASETYO','12.1 BKMT',4],['ARIQ NAZRIL ALAWY','12.1 BKMT',6],['RAFFY MAULANA','12.1 BKMT',28],['TONIDIN','12.1 BKMT',31]];
function profil(){
  clearInterval(tm);
  app.innerHTML=`<h1>Profil Kelompok</h1><p class="sub">Kelompok 1 \u00b7 Kelas 12.1</p>
  <div class="grid">${M.map((m,k)=>`<article class="mem"><img src="${IMG[k]}" alt="Foto ${m[0]}"><div><h3>${m[0]}</h3><p>Kelas ${m[1]}</p><span class="pill">No. Absen ${m[2]}</span></div></article>`).join('')}</div>
  <div class="row" style="margin-top:24px"><button class="btn p" data-go="home">Mulai Mengerjakan Soal</button></div>`;
}

$('#nav').onclick=e=>{const a=e.target.closest('[data-go]');if(!a)return;e.preventDefault();go(a.dataset.go)};

function go(v){location.hash=v==='home'?'':v;draw()}
function draw(){
  document.querySelectorAll('#nav a').forEach(x=>x.classList.toggle('on',x.dataset.go===(location.hash.slice(1)==='profil'?'profil':'home')));
  const h=location.hash.slice(1);
  if(h==='latihan'||h==='tryout'){if(h==='tryout'&&P2.done)return result(P2.ans,'Hasil TryOut PSAS');quiz(h)}
  else if(h==='rekap')result(P1,'Skor Akhir');
  else if(h==='hasil')result(P2.ans,'Hasil TryOut PSAS');
  else if(h==='profil')profil();
  else home();
  scrollTo(0,0);
}
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-o],[data-nav],[data-fin],[data-reset],[data-retry]');if(!t)return;
  const d=t.dataset;
  if(d.go){e.preventDefault();if(d.go==='latihan'||d.go==='tryout'){const s=d.go==='latihan'?P1:P2.ans;i=0;while(s[i]!==undefined&&i<n-1)i++}go(d.go)}
  else if(d.o!==undefined){const m=location.hash.slice(1);if(m==='latihan'){if(P1[i]!==undefined)return;P1[i]=+d.o;sv('psas_p1',P1)}else{P2.ans[i]=+d.o;sv('psas_p2',P2)}quiz(m)}
  else if(d.nav){i+=+d.nav;quiz(location.hash.slice(1))}
  else if(d.fin){if(confirm('Selesaikan TryOut sekarang?'))fin()}
  else if(d.retry){P1={};sv('psas_p1',P1);i=0;go('latihan')}
  else if(d.reset){P1={};sv('psas_p1',P1);i=0;go('latihan')}
});
addEventListener('hashchange',draw);
draw();
</script>
